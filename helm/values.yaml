opensearch-cluster:
  # OpenSearchCluster configuration
  cluster:
    # -- OpenSearchCluster name, by default release name is used
    name: "opensearch"
    general:
      serviceName: "opensearch"
      version: 3.5.0
      vendor: Opensearch
      httpPort: 9200
      setVMMaxMapCount: true
      drainDataNodes: true
      pluginsList: []
      monitoring:
        enable: true
        labels:
          serviceMonitorSelector: prometheus
          release: prometheus
        tlsConfig:
          insecureSkipVerify: true
    dashboards:
      enable: true
      basePath: "/kibana"
      version: 3.5.0
      replicas: 1
      resources:
        requests:
          memory: "512Mi"
          cpu: "200m"
        limits:
          memory: "512Mi"
          cpu: "200m"
      tls:
        enable: false
      additionalConfig:
        data_source.enabled: "true"
        data_source.manageIndex: "true"
        data_source.endpointDeniedIPs: "[]"
        data_source.list[0].name: "Prometheus"
        data_source.list[0].type: "prometheus"
        data_source.list[0].url: "http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090/prometheus"
        data_source.list[0].auth.type: "no_auth"
      opensearchCredentialsSecret:
        name: "opensearch-admin-password"
    nodePools:
    - component: masters
      diskSize: "5Gi"
      replicas: 3
      roles:
        - "master"
        - "data"
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "500m"
    security:
      config: {}
