{{- $secretName := .Values.adminCredentials.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch-admin-credentials
  annotations:
    # keep the secret (and any manually rotated password) even if it's removed from values
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if $existing }}
  username: {{ index $existing.data "username" }}
  password: {{ index $existing.data "password" }}
{{- else }}
  username: {{ .Values.adminCredentials.username | b64enc }}
  password: {{ .Values.adminCredentials.password | b64enc }}
{{- end }}
